<!DOCTYPE html>
<html>
<head>
  <title>Firebase Loading Debug</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    .log { background: white; padding: 15px; margin: 10px 0; border-left: 4px solid #2196F3; }
    .error { border-left-color: #f44336; }
    .success { border-left-color: #4CAF50; }
    pre { background: #f0f0f0; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>🔍 Firebase SDK Loading Debug</h1>
  
  <div id="logs"></div>

  <script>
    function log(msg, type = 'info') {
      const logsDiv = document.getElementById('logs');
      const div = document.createElement('div');
      div.className = 'log ' + type;
      div.textContent = msg;
      logsDiv.appendChild(div);
      console.log(msg);
    }

    log('Page loaded, starting debug...', 'info');

    // Check if Firebase scripts load
    window.addEventListener('error', (event) => {
      if (event.message && event.message.includes('firebase')) {
        log('❌ Firebase error: ' + event.message, 'error');
      }
    });

    // Monitor script loading
    window.addEventListener('load', () => {
      log('✓ Page fully loaded', 'success');
      
      setTimeout(() => {
        if (typeof firebase !== 'undefined') {
          log('✓ Firebase SDK loaded successfully!', 'success');
          log('Firebase version: ' + firebase.SDK_VERSION, 'success');
        } else {
          log('✗ Firebase SDK NOT loaded after page load', 'error');
          log('Check browser Network tab for failed requests', 'error');
        }
      }, 1000);
    });
  </script>

  <!-- Firebase SDK -->
  <script>
    log('Loading Firebase SDK from CDN...', 'info');
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js" 
    onload="log('✓ firebase-app.js loaded', 'success')"
    onerror="log('✗ firebase-app.js failed to load', 'error')">
  </script>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"
    onload="log('✓ firebase-database.js loaded', 'success')"
    onerror="log('✗ firebase-database.js failed to load', 'error')">
  </script>

  <script>
    log('Scripts declared, checking Firebase availability...', 'info');
    
    // Final check after a delay
    setTimeout(() => {
      const logDiv = document.getElementById('logs');
      const div = document.createElement('div');
      div.className = 'log info';
      div.innerHTML = '<strong>Final Status:</strong><br>' +
        'Firebase object: ' + (typeof firebase !== 'undefined' ? '✓ Available' : '✗ Missing') + '<br>' +
        'Current time: ' + new Date().toLocaleTimeString();
      logDiv.appendChild(div);
    }, 2000);
  </script>
</body>
</html>
