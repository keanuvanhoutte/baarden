<!DOCTYPE html>
<html>
<head>
<title>Firebase REST API Test</title>
<style>
  body { font-family: monospace; padding: 20px; background: #f0f0f0; }
  .log { background: white; padding: 10px; margin: 10px 0; border-left: 3px solid #007bff; }
  .error { border-left-color: #dc3545; color: #dc3545; }
  .success { border-left-color: #28a745; color: #28a745; }
  button { padding: 10px 20px; margin: 5px; }
</style>
</head>
<body>
<h1>Firebase REST API Test</h1>

<div>
  <button onclick="testCreate()">Test: Create Room</button>
  <button onclick="testLoad()">Test: Load Room</button>
  <button onclick="testDelete()">Test: Delete Room</button>
  <button onclick="clearLogs()">Clear Logs</button>
</div>

<div id="logs"></div>

<script>
const DB_URL = 'https://baarden-f45cf-default-rtdb.europe-west1.firebasedatabase.app';

function log(msg, isError = false) {
  const div = document.createElement('div');
  div.className = 'log' + (isError ? ' error' : ' success');
  div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
  document.getElementById('logs').appendChild(div);
  console.log(msg);
}

async function testCreate() {
  log('Creating room FIREBASE_TEST...');
  const state = {
    players: { red: true, black: false },
    board: {},
    turn: 'red'
  };

  try {
    const url = `${DB_URL}/rooms/FIREBASE_TEST/gameState.json`;
    const response = await fetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    });

    if (!response.ok) {
      log(`Error creating room: HTTP ${response.status}`, true);
      return;
    }

    const data = await response.json();
    log('✓ Room created successfully');
    log('Response: ' + JSON.stringify(data).substring(0, 100));
  } catch (e) {
    log('Error: ' + e.message, true);
  }
}

async function testLoad() {
  log('Loading room FIREBASE_TEST...');

  try {
    const url = `${DB_URL}/rooms/FIREBASE_TEST/gameState.json`;
    const response = await fetch(url);

    if (response.status === 404) {
      log('Room not found (404)', true);
      return;
    }

    if (!response.ok) {
      log(`Error loading room: HTTP ${response.status}`, true);
      return;
    }

    const data = await response.json();
    if (data === null) {
      log('Room exists but is empty (null)', true);
    } else {
      log('✓ Room loaded successfully');
      log('Data: ' + JSON.stringify(data).substring(0, 150));
    }
  } catch (e) {
    log('Error: ' + e.message, true);
  }
}

async function testDelete() {
  log('Deleting room FIREBASE_TEST...');

  try {
    const url = `${DB_URL}/rooms/FIREBASE_TEST.json`;
    const response = await fetch(url, { method: 'DELETE' });

    if (!response.ok) {
      log(`Error deleting room: HTTP ${response.status}`, true);
      return;
    }

    log('✓ Room deleted successfully');
  } catch (e) {
    log('Error: ' + e.message, true);
  }
}

function clearLogs() {
  document.getElementById('logs').innerHTML = '';
}

// Auto-test on load
window.onload = () => {
  log('Page loaded. Firebase URL: ' + DB_URL);
};
</script>
</body>
</html>
