<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Baarden">
  <!-- Icoon van Baarden: een gouden B op groen laken, met een gouden kader.
       Let op: de letter is tekst, en Georgia staat niet op elk toestel. De bestanden die het spel
       echt gebruikt zijn daarom de PNG's hiernaast, gerasterd vanuit deze tekening, zodat de B er
       overal hetzelfde uitziet. Dit bestand is de bron om mee verder te werken. -->
  <defs>
    <linearGradient id="laken" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14573f"/>
      <stop offset="1" stop-color="#06271d"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#laken)"/>
  <rect x="44" y="44" width="424" height="424" rx="80" fill="none" stroke="#c8a94f" stroke-width="16"/>
  <text x="256" y="376" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="340" font-weight="bold" fill="#e3c76a">B</text>
</svg>
